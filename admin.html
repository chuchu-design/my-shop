<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團主管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 頂部列 -->
  <nav class="bg-slate-800 text-white p-4 shadow-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">⚙️ 團主後台管理系統</h1>
      <div id="user-info" class="flex items-center gap-3">
        <!-- 登入狀態區 -->
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 sm:p-6">
    <!-- 頁籤控制 -->
    <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button id="tab-add-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-white">
        ➕ 商品上架
      </button>
      <button id="tab-members-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        👥 團員名單管理
      </button>
      <button id="tab-orders-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        📦 訂單管理
      </button>
    </div>

    <!-- 頁籤 1: 商品上架 -->
    <div id="section-add-product" class="bg-white p-6 rounded-b-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">新增團購商品</h2>
      <form id="add-product-form" class="space-y-4 max-w-xl">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">團購名稱 / 店家品牌</label>
          <input type="text" id="store-title" required class="w-full border rounded p-2 text-sm" placeholder="例如：名偵探柯南30週年場販">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱</label>
          <input type="text" id="product-name" required class="w-full border rounded p-2 text-sm" placeholder="例如：柯南光柵立牌">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">商品圖片 (二選一)</label>
          <input type="url" id="product-img-url" class="w-full border rounded p-2 text-sm mb-2" placeholder="貼上圖片網址 https://...">
          <input type="file" id="product-img-file" accept="image/*" class="w-full text-xs text-gray-500">
        </div>
        
        <!-- 款式選項 -->
        <div class="border p-3 rounded bg-gray-50 space-y-2">
          <label class="block text-xs font-bold text-gray-600">款式選項 1</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="opt-name-1" required placeholder="款式名稱 (例: 江戶川柯南)" class="border rounded p-1.5 text-xs">
            <input type="number" id="opt-price-1" required placeholder="價格" class="border rounded p-1.5 text-xs">
          </div>
        </div>
        <div class="border p-3 rounded bg-gray-50 space-y-2">
          <label class="block text-xs font-bold text-gray-600">款式選項 2</label>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="opt-name-2" placeholder="款式名稱 (例: 怪盜基德)" class="border rounded p-1.5 text-xs">
            <input type="number" id="opt-price-2" placeholder="價格" class="border rounded p-1.5 text-xs">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
          確認發布商品
        </button>
      </form>
    </div>

    <!-- 頁籤 2: 團員名單 (可修改暱稱) -->
    <div id="section-members" class="hidden bg-white p-6 rounded-b-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">已註冊團員名單</h2>
      <div id="member-list-container">
        <p class="text-gray-500 text-sm">載入團員資料中...</p>
      </div>
    </div>

    <!-- 頁籤 3: 訂單管理 -->
    <div id="section-orders" class="hidden bg-white p-6 rounded-b-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">團員下單紀錄</h2>
      <div id="order-list-container">
        <p class="text-gray-500 text-sm">載入訂單資料中...</p>
      </div>
    </div>
  </main>

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./products.js"></script>
  <script>
    // 切換頁籤邏輯
    const tabAdd = document.getElementById('tab-add-btn');
    const tabMembers = document.getElementById('tab-members-btn');
    const tabOrders = document.getElementById('tab-orders-btn');

    const secAdd = document.getElementById('section-add-product');
    const secMembers = document.getElementById('section-members');
    const secOrders = document.getElementById('section-orders');

    function resetTabs() {
      [tabAdd, tabMembers, tabOrders].forEach(t => {
        t.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700";
      });
      [secAdd, secMembers, secOrders].forEach(s => s.classList.add('hidden'));
    }

    tabAdd.addEventListener('click', () => {
      resetTabs();
      tabAdd.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-white";
      secAdd.classList.remove('hidden');
    });

    tabMembers.addEventListener('click', () => {
      resetTabs();
      tabMembers.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-white";
      secMembers.classList.remove('hidden');
    });

    tabOrders.addEventListener('click', () => {
      resetTabs();
      tabOrders.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-white";
      secOrders.classList.remove('hidden');
    });
  </script>
</body>
</html>
