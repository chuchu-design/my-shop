<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團主後台管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 頂部導覽列 -->
  <nav class="bg-slate-800 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🛡️</span> 團主後台管理
      </h1>
      <a href="index.html" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">
        返回前台賣場
      </a>
    </div>
  </nav>

  <!-- 主要內容區 -->
  <main class="max-w-2xl mx-auto p-4 sm:p-6">
    
    <!-- 商品上架卡片 -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
      <div class="border-b pb-4 mb-6">
        <h2 class="text-xl font-bold text-gray-800">新建團購賣場商品</h2>
        <p class="text-sm text-gray-500 mt-1">在這裡設定活動名稱與商品規格，發布後團員即可下單。</p>
      </div>

      <form id="add-product-form" class="space-y-5">
        <!-- 賣場/活動名稱 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">賣場 / 活動名稱</label>
          <input type="text" id="store-title" value="名偵探柯南30週年場販" required 
                 class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- 商品名稱 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">商品名稱</label>
          <input type="text" id="product-name" value="光柵立牌第二彈" required 
                 class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- 規格與價格設定區 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
          <label class="block text-sm font-bold text-gray-700">商品規格與價格</label>
          
          <!-- 規格 1 -->
          <div class="flex gap-3">
            <input type="text" id="opt-name-1" value="盲抽一抽" placeholder="規格名稱" required 
                   class="w-2/3 p-2.5 border border-gray-300 rounded-md text-sm">
            <div class="w-1/3 flex items-center bg-white border border-gray-300 rounded-md px-3">
              <span class="text-gray-500 text-sm mr-1">NT$</span>
              <input type="number" id="opt-price-1" value="300" placeholder="金額" required 
                     class="w-full p-1 border-none text-sm focus:outline-none">
            </div>
          </div>

          <!-- 規格 2 -->
          <div class="flex gap-3">
            <input type="text" id="opt-name-2" value="端盒" placeholder="規格名稱" required 
                   class="w-2/3 p-2.5 border border-gray-300 rounded-md text-sm">
            <div class="w-1/3 flex items-center bg-white border border-gray-300 rounded-md px-3">
              <span class="text-gray-500 text-sm mr-1">NT$</span>
              <input type="number" id="opt-price-2" value="2950" placeholder="金額" required 
                     class="w-full p-1 border-none text-sm focus:outline-none">
            </div>
          </div>
        </div>

        <!-- 提交按鈕 -->
        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-sm">
          確認發布商品
        </button>
      </form>
    </div>

  </main>

  <!-- 引入後台腳本 -->
  <script type="module" src="products.js"></script>
</body>
</html>
