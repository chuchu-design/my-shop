<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團主管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-16">

  <!-- 頂部列 -->
  <nav class="bg-slate-800 text-white p-4 shadow-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">⚙️ 團主後台管理系統</h1>
      <div id="user-info" class="flex items-center gap-3"></div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-4 sm:p-6">
    <!-- 頁籤列 -->
    <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button id="tab-add-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-white">
        ➕ 上架商品
      </button>
      <button id="tab-proxy-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        🙋 團主代下單/新增訂單
      </button>
      <button id="tab-members-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        👥 團員名單
      </button>
      <button id="tab-orders-btn" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        📦 訂單管理 & 歷程
      </button>
    </div>

    <!-- 頁籤 1: 商品上架 (支援無限動態選項) -->
    <div id="section-add-product" class="bg-white p-6 rounded-b-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">新增團購商品</h2>
      <form id="add-product-form" class="space-y-4 max-w-xl">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">團購名稱 / 店家品牌</label>
          <input type="text" id="store-title" required class="w-full border rounded p-2 text-sm" placeholder="例如：名偵探柯南30週年場販">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱</label>
          <input type="text" id="product-name" required class="w-full border rounded p-2 text-sm" placeholder="例如：光柵立牌第二彈">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">商品圖片 (二選一)</label>
          <input type="url" id="product-img-url" class="w-full border rounded p-2 text-sm mb-2" placeholder="貼上圖片網址 https://...">
          <input type="file" id="product-img-file" accept="image/*" class="w-full text-xs text-gray-500">
        </div>
        
        <!-- 動態款式選項容器 -->
        <div class="space-y-3 pt-2 border-t">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-bold text-gray-700">商品款式與價格選項</label>
            <button type="button" id="add-option-btn" class="bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-bold px-3 py-1.5 rounded-lg border border-blue-200 transition">
              ➕ 新增款式選項
            </button>
          </div>

          <div id="options-container" class="space-y-2">
            <!-- JS 動態生成選項 -->
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition shadow mt-4">
          確認發布商品
        </button>
      </form>
    </div>

    <!-- 頁籤 2: 團主幫團員代下單 / 手動新增 -->
    <div id="section-proxy" class="hidden bg-white p-6 rounded-b-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">🙋 團主協助團員手動新增訂單</h2>
      <form id="proxy-order-form" class="space-y-4 max-w-xl">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">1. 選擇團員</label>
          <select id="proxy-user-select" required class="w-full border rounded p-2 text-sm">
            <option value="">載入團員中...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">2. 選擇前台商品規格</label>
          <select id="proxy-product-select" required class="w-full border rounded p-2 text-sm">
            <option value="">載入前台現有商品中...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">3. 數量</label>
          <input type="number" id="proxy-qty" value="1" min="1" required class="w-full border rounded p-2 text-sm">
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded transition">
          ➕ 確認新增/代下單
        </button>
      </form>
    </div>

    <!-- 頁籤 3: 團員名單 -->
    <div id="section-members" class="hidden bg-white p-6 rounded-b-lg shadow-sm">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">已註冊團員名單</h2>
      <div id="member-list-container">
        <p class="text-gray-500 text-sm">載入團員資料中...</p>
      </div>
    </div>

    <!-- 頁籤 4: 訂單管理 -->
    <div id="section-orders" class="hidden bg-white p-6 rounded-b-lg shadow-sm">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-xl font-bold text-gray-700">📦 訂單總覽與紀錄</h2>
        <button onclick="openMergeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow transition flex items-center gap-1">
          🔗 合併訂單功能
        </button>
      </div>

      <div id="order-list-container">
        <p class="text-gray-500 text-sm">載入訂單資料中...</p>
      </div>
    </div>
  </main>

  <!-- 合併訂單 Modal -->
  <div id="merge-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white max-w-lg w-full rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-gray-800">🔗 合併兩筆訂單</h3>
        <button onclick="closeMergeModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>
      <p class="text-xs text-gray-500">把「來源訂單」數量合併併入「目標訂單」，完成後自動刪除來源訂單。</p>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">1. 選擇【來源訂單】(會被併入並刪除)</label>
        <select id="merge-source-select" class="w-full border rounded p-2 text-xs"></select>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">2. 選擇【目標訂單】(保留，數量加總)</label>
        <select id="merge-target-select" class="w-full border rounded p-2 text-xs"></select>
      </div>

      <button onclick="executeMergeOrders()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition text-sm">
        確認執行合併
      </button>
    </div>
  </div>

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./products.js"></script>
  <script>
    const tabs = [
      { btn: 'tab-add-btn', sec: 'section-add-product' },
      { btn: 'tab-proxy-btn', sec: 'section-proxy' },
      { btn: 'tab-members-btn', sec: 'section-members' },
      { btn: 'tab-orders-btn', sec: 'section-orders' }
    ];

    tabs.forEach(t => {
      document.getElementById(t.btn).addEventListener('click', () => {
        tabs.forEach(item => {
          document.getElementById(item.btn).className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700";
          document.getElementById(item.sec).classList.add('hidden');
        });
        document.getElementById(t.btn).className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-blue-600 text-blue-600 bg-white";
        document.getElementById(t.sec).classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
