<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團主後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 頂部導覽列 -->
  <nav class="bg-slate-800 text-white p-4 shadow-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🛡️</span> 團主後台管理
      </h1>
      <a href="index.html" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">
        看前台賣場 ➔
      </a>
    </div>
  </nav>

  <!-- 主要內容區 -->
  <main class="max-w-5xl mx-auto p-4 sm:p-6">
    
    <!-- 後台功能頁籤切換 -->
    <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
      <button onclick="switchTab('upload')" id="tab-upload" class="flex-1 py-3 px-4 font-bold text-center border-b-2 border-blue-600 text-blue-600">
        📦 商品上架
      </button>
      <button onclick="switchTab('members')" id="tab-members" class="flex-1 py-3 px-4 font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        👥 團員管理
      </button>
      <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-3 px-4 font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700">
        📋 下單紀錄
      </button>
    </div>

    <!-- 1. 商品上架區塊 -->
    <div id="section-upload" class="bg-white rounded-xl shadow-md p-6 border border-gray-200 max-w-2xl mx-auto">
      <h2 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">新建團購賣場商品</h2>

      <form id="add-product-form" class="space-y-4">
        <!-- 賣場/活動名稱 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">賣場 / 活動名稱</label>
          <input type="text" id="store-title" value="名偵探柯南30週年場販" required 
                 class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- 商品名稱 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">商品名稱</label>
          <input type="text" id="product-name" value="光柵立牌第二彈" required 
                 class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- 圖片上傳/網址 -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">商品圖片 (上傳檔案或貼上圖片網址)</label>
          <input type="file" id="product-img-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-2">
          <input type="url" id="product-img-url" placeholder="或直接貼上圖片 URL 網址" 
                 class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:outline-none">
        </div>

        <!-- 規格與價格設定區 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
          <label class="block text-sm font-bold text-gray-700">商品規格與價格</label>
          
          <div class="flex gap-3">
            <input type="text" id="opt-name-1" value="盲抽一抽" placeholder="規格名稱" required class="w-2/3 p-2 border rounded-md text-sm">
            <div class="w-1/3 flex items-center bg-white border rounded-md px-2">
              <span class="text-gray-500 text-sm">NT$</span>
              <input type="number" id="opt-price-1" value="300" placeholder="金額" required class="w-full p-1 border-none text-sm focus:outline-none">
            </div>
          </div>

          <div class="flex gap-3">
            <input type="text" id="opt-name-2" value="端盒" placeholder="規格名稱" required class="w-2/3 p-2 border rounded-md text-sm">
            <div class="w-1/3 flex items-center bg-white border rounded-md px-2">
              <span class="text-gray-500 text-sm">NT$</span>
              <input type="number" id="opt-price-2" value="2950" placeholder="金額" required class="w-full p-1 border-none text-sm focus:outline-none">
            </div>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
          確認發布商品
        </button>
      </form>
    </div>

    <!-- 2. 團員管理區塊 -->
    <div id="section-members" class="hidden bg-white rounded-xl shadow-md p-6 border border-gray-200">
      <h2 class="text-xl font-bold text-gray-800 mb-4">👥 團員名單與暱稱設定</h2>
      <div id="member-list-container" class="text-gray-500 text-sm">載入團員資料中...</div>
    </div>

    <!-- 3. 下單紀錄區塊 -->
    <div id="section-orders" class="hidden bg-white rounded-xl shadow-md p-6 border border-gray-200">
      <h2 class="text-xl font-bold text-gray-800 mb-4">📋 團員下單總覽</h2>
      <div id="order-list-container" class="text-gray-500 text-sm">尚無下單紀錄</div>
    </div>

  </main>

  <script>
    // 頁籤切換邏輯
    function switchTab(tab) {
      ['upload', 'members', 'orders'].forEach(t => {
        document.getElementById(`section-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'flex-1 py-3 px-4 font-bold text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700';
      });
      document.getElementById(`section-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-3 px-4 font-bold text-center border-b-2 border-blue-600 text-blue-600';
    }
  </script>
  <script type="module" src="products.js"></script>
</body>
</html>
