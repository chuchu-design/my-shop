<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賣家後台</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto; }
    nav { margin-bottom: 20px; background: #f0f0f0; padding: 10px; border-radius: 6px; }
    nav a { margin-right: 15px; font-weight: bold; text-decoration: none; color: #0076ff; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .clear-btn { background: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; float: right; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🛒 購物下單</a> | 
    <a href="search.html">🔍 團員查單與轉單</a> | 
    <a href="admin.html">⚙️ 賣家後台</a>
  </nav>

  <h1>⚙️ 賣家後台 - 所有訂單總覽</h1>
  <button class="clear-btn" onclick="clearAllOrders()">清空所有測試訂單</button>

  <div id="admin-orders-table"></div>

  <script src="products.js"></script>
  <script>
    function renderAdminOrders() {
      const orders = getOrders();
      const container = document.getElementById('admin-orders-table');

      if (orders.length === 0) {
        container.innerHTML = "<p>目前沒有任何訂單紀錄。</p>";
        return;
      }

      let totalSales = 0;
      let html = `
        <table>
          <thead>
            <tr>
              <th>訂單編號</th>
              <th>團員姓名</th>
              <th>手機號碼</th>
              <th>訂購內容</th>
              <th>金額</th>
              <th>目前驗證碼</th>
              <th>下單時間</th>
            </tr>
          </thead>
          <tbody>
      `;

      orders.forEach(o => {
        totalSales += o.total;
        html += `
          <tr>
            <td><strong>${o.id}</strong></td>
            <td>${o.memberName}</td>
            <td>${o.memberPhone}</td>
            <td>${o.items.map(i => `${i.name} x${i.qty}`).join('<br>')}</td>
            <td>NT$ ${o.total}</td>
            <td><code>${o.verifyCode}</code></td>
            <td>${o.createdAt}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
        <h3>賣場總銷售額：NT$ ${totalSales}</h3>
      `;

      container.innerHTML = html;
    }

    function clearAllOrders() {
      if (confirm("確定要清空所有訂單嗎？")) {
        localStorage.removeItem('orders');
        renderAdminOrders();
      }
    }

    renderAdminOrders();
  </script>
</body>
</html>
