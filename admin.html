<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團主後台 - 代購網站</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- 1. 未驗證 / 未登入時顯示的阻擋畫面 -->
  <div id="admin-auth-modal" class="fixed inset-0 bg-slate-900 bg-opacity-95 flex items-center justify-center z-50 p-4">
    <div class="bg-white p-6 rounded-xl max-w-sm w-full text-center shadow-2xl">
      <h2 class="text-xl font-bold text-gray-800 mb-2">🔒 團主專屬後台</h2>
      <p class="text-sm text-gray-500 mb-6" id="auth-status-text">請先以團主 Google 帳號登入系統</p>
      
      <button id="admin-login-btn" onclick="handleGoogleLogin()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition">
        Google 登入驗證
      </button>

      <div class="mt-4 border-t pt-4">
        <a href="index.html" class="text-sm text-gray-400 hover:text-gray-600">← 返回商品大廳</a>
      </div>
    </div>
  </div>

  <!-- 2. 團主後台主要畫面 (驗證通過後自動解鎖顯示) -->
  <div id="admin-content" class="hidden flex flex-col md:flex-row min-h-screen">
    <!-- 電腦端側邊欄 -->
    <aside class="hidden md:flex flex-col w-64 bg-slate-800 text-white min-h-screen p-4">
      <h1 class="text-xl font-bold mb-6 text-amber-400">👑 團主後台</h1>
      <nav class="flex flex-col space-y-2">
        <a href="admin.html" class="p-3 rounded-lg bg-slate-700 text-amber-400 font-bold">📊 統計總覽</a>
        <a href="index.html" class="p-3 rounded-lg hover:bg-slate-700 text-gray-300">🛒 返回賣場</a>
      </nav>
      <div class="mt-auto pt-4 border-t border-slate-700 text-xs text-slate-400" id="admin-user-display">
        團主已驗證
      </div>
    </aside>

    <!-- 主要內容區 -->
    <main class="flex-1 p-4 md:p-8 mb-16 md:mb-0">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">團主數據中心</h2>
        <button onclick="handleLogout()" class="text-sm bg-slate-200 hover:bg-slate-300 text-gray-700 px-3 py-1.5 rounded-lg">登出帳號</button>
      </div>

      <!-- 數據卡片區 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="text-gray-500 font-medium mb-2">📦 開團商品總下單數</h3>
          <p class="text-3xl font-bold text-indigo-600" id="total-products-count">0 件</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="text-gray-500 font-medium mb-2">👥 總跟團人數</h3>
          <p class="text-3xl font-bold text-emerald-600" id="total-members-count">0 人</p>
        </div>
      </div>

      <!-- 團員訂單明細表 -->
      <div class="bg-white rounded-xl shadow-sm border p-4">
        <h3 class="text-lg font-bold mb-4 text-gray-800">團員訂單總量</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b text-gray-500 text-sm">
                <th class="p-2">團員姓名</th>
                <th class="p-2">訂單總數</th>
                <th class="p-2">下單總金額</th>
              </tr>
            </thead>
            <tbody id="admin-member-list">
              <tr>
                <td colspan="3" class="p-4 text-center text-gray-400">尚無資料</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- 手機端底部捷徑 -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-800 text-white flex justify-around p-2 text-xs text-center z-10">
      <a href="index.html" class="flex-1 py-1">🛒<br>賣場</a>
      <a href="admin.html" class="flex-1 py-1 text-amber-400 font-bold">👑<br>後台</a>
    </nav>
  </div>

  <!-- 引入 Google 登入邏輯 -->
  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import "./auth.js";

    // 監聽登入狀態：只要登入者是任何已驗證使用者就放行（或可綁定你的特定 Email）
    const auth = getAuth();
    onAuthStateChanged(auth, (user) => {
      const modal = document.getElementById('admin-auth-modal');
      const content = document.getElementById('admin-content');
      const statusText = document.getElementById('auth-status-text');
      const userDisplay = document.getElementById('admin-user-display');

      if (user) {
        // 已登入：隱藏遮罩，顯示後台內容
        modal.classList.add('hidden');
        content.classList.remove('hidden');
        if (userDisplay) userDisplay.innerText = `👑 團主：${user.displayName || user.email}`;
      } else {
        // 未登入：跳出 Google 登入要求
        modal.classList.remove('hidden');
        content.classList.add('hidden');
        statusText.innerText = "請點擊下方按鈕以 Google 帳號驗證團主身份";
      }
    });
  </script>
</body>
</html>
