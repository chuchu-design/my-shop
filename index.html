<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團購賣場</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    nav { margin-bottom: 20px; background: #f0f0f0; padding: 10px; border-radius: 6px; }
    nav a { margin-right: 15px; font-weight: bold; text-decoration: none; color: #0076ff; }
    .product-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cart-box { background: #fdf8f0; border: 2px dashed #ffa726; padding: 15px; border-radius: 8px; margin-top: 30px; }
    button { background: #0076ff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    input { padding: 8px; width: 80%; margin-bottom: 8px; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🛒 購物下單</a> | 
    <a href="search.html">🔍 團員查單與轉單</a> | 
    <a href="admin.html">⚙️ 賣家後台</a>
  </nav>

  <h1>🛒 團購商品列表</h1>
  <div id="product-list"></div>

  <div class="cart-box">
    <h2>🛍️ 我的購物車</h2>
    <div id="cart-items">無商品</div>
    <p><strong>總金額：NT$ <span id="cart-total">0</span></strong></p>

    <hr>
    <h3>下單資料</h3>
    <p><input type="text" id="buyer-name" placeholder="請輸入姓名 / 暱稱"></p>
    <p><input type="text" id="buyer-phone" placeholder="請輸入手機號碼"></p>
    <button onclick="handleCheckout()">送出訂單</button>
  </div>

  <script src="products.js"></script>
  <script>
    function renderProducts() {
      const container = document.getElementById('product-list');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <div>
            <h3>${p.name}</h3>
            <p>價格：NT$ ${p.price}</p>
          </div>
          <button onclick="addToCart(${p.id})">加入購物車</button>
        </div>
      `).join('');
    }

    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      if (cart.length === 0) {
        container.innerHTML = "<p>購物車目前是空的</p>";
        totalEl.innerText = "0";
        return;
      }

      container.innerHTML = cart.map(item => `
        <p>${item.name} x ${item.qty} = NT$ ${item.price * item.qty}</p>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      totalEl.innerText = total;
    }

    function handleCheckout() {
      const name = document.getElementById('buyer-name').value.trim();
      const phone = document.getElementById('buyer-phone').value.trim();

      if (!name || !phone) {
        alert("請完整填寫姓名與手機號碼！");
        return;
      }

      const order = submitOrder(name, phone);
      if (order) {
        alert(`🎉 下單成功！\n訂單編號：${order.id}\n轉單驗證碼：${order.verifyCode}\n（若日後要轉單給別人，請給他此驗證碼）`);
        document.getElementById('buyer-name').value = '';
        document.getElementById('buyer-phone').value = '';
        renderCart();
      }
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>
