<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團購賣場</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-32">

  <!-- 頂部導覽列 -->
  <nav class="bg-white border-b shadow-sm p-4 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
      <h1 class="text-xl font-bold text-blue-600">🛒 團購賣場</h1>
      
      <div class="flex items-center gap-3">
        <button onclick="openCartModal()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow flex items-center gap-1">
          🛒 購物車 (<span id="cart-nav-count">0</span>)
        </button>
        <div id="user-info" class="flex items-center gap-2">
          <span class="text-xs text-gray-400">載入中...</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主要內容 -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-8">
    <div class="flex justify-between items-center border-b pb-4">
      <h2 class="text-2xl font-bold text-gray-800">進行中的團購</h2>
      <a href="admin.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded">團主後台</a>
    </div>

    <!-- 商品開團分類區 -->
    <div id="products-container" class="space-y-8">
      <p class="text-gray-500">商品載入中...</p>
    </div>

    <!-- 個人歷史訂單區 & 轉單專區 -->
    <div class="mt-12 pt-8 border-t border-gray-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
          📜 我的下單紀錄
        </h3>
        <button onclick="receiveTransferPrompt()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow transition flex items-center gap-1">
          📥 輸入驗證碼接收轉單
        </button>
      </div>

      <div id="my-orders-container" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
        <p class="text-gray-400 text-sm">請先登入以檢視您的訂單紀錄。</p>
      </div>
    </div>
  </main>

  <!-- 右下角懸浮大購物車按鈕 -->
  <div class="fixed bottom-6 right-6 z-40">
    <button onclick="openCartModal()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 transition transform active:scale-95 border-2 border-white">
      <span class="text-lg">🛒 開啟購物車</span>
      <span id="cart-floating-badge" class="bg-red-500 text-white text-xs font-black rounded-full px-2 py-0.5 shadow">0</span>
    </button>
  </div>

  <!-- 購物車 Modal (新增訂單備註) -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h3 class="text-xl font-bold text-gray-800">🛍️ 我的購物車清單</h3>
          <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
        </div>

        <div id="cart-items-container" class="space-y-3">
          <p class="text-gray-400 text-sm text-center py-8">購物車目前是空的</p>
        </div>
      </div>

      <div class="border-t pt-4 space-y-3 bg-white">
        <!-- 新增訂單備註輸入框 -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">📝 訂單備註（選填，可填寫特定角色/規格/需求）：</label>
          <input type="text" id="cart-order-note" placeholder="例如：柯南x1、基德x1 / 排配角優先" class="w-full border rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="flex justify-between text-lg font-bold">
          <span>總計金額：</span>
          <span id="cart-total-price" class="text-blue-600 font-extrabold">NT$ 0</span>
        </div>
        <button onclick="checkoutCart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-base">
          確認送出訂單
        </button>
      </div>
    </div>
  </div>

  <!-- 圖片大圖 Modal -->
  <div id="image-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full flex justify-center items-center">
      <button id="close-modal-btn" class="absolute -top-10 right-0 text-white text-3xl font-bold">&times;</button>
      <img id="modal-img" src="" class="max-h-[85vh] max-w-full object-contain rounded-lg">
    </div>
  </div>

  <script type="module">
    import { db, auth } from "./auth.js";
    import { collection, onSnapshot, query, orderBy, where, addDoc, serverTimestamp, doc, getDoc, updateDoc, arrayUnion, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const container = document.getElementById('products-container');
    const myOrdersContainer = document.getElementById('my-orders-container');
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');

    let cart = JSON.parse(localStorage.getItem('user_cart') || '[]');

    function saveCart() {
      localStorage.setItem('user_cart', JSON.stringify(cart));
      renderCart();
    }

    window.openCartModal = () => document.getElementById('cart-modal').classList.remove('hidden');
    window.closeCartModal = () => document.getElementById('cart-modal').classList.add('hidden');

    window.addToCart = (storeTitle, productName, optionName, price) => {
      const idx = cart.findIndex(i => i.storeTitle === storeTitle && i.productName === productName && i.optionName === optionName);
      if (idx > -1) {
        cart[idx].qty += 1;
      } else {
        cart.push({ storeTitle, productName, optionName, price, qty: 1 });
      }
      saveCart();
      alert(`✅ 已加入購物車：【${productName} - ${optionName}】`);
    };

    window.updateCartQty = (index, delta) => {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveCart();
    };

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const navCount = document.getElementById('cart-nav-count');
      const floatBadge = document.getElementById('cart-floating-badge');
      const totalEl = document.getElementById('cart-total-price');

      let totalCount = 0;
      let totalPrice = 0;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm text-center py-8">購物車目前是空的</p>`;
      } else {
        let html = '';
        cart.forEach((item, index) => {
          totalCount += item.qty;
          totalPrice += item.price * item.qty;
          html += `
            <div class="p-3 border rounded-xl bg-gray-50 flex justify-between items-center shadow-sm">
              <div>
                <span class="text-[10px] bg-blue-100 text-blue-800 font-bold px-1.5 py-0.5 rounded mr-1">${item.storeTitle}</span>
                <div class="font-bold text-gray-800 text-sm mt-1">${item.productName}</div>
                <div class="text-xs text-gray-500">${item.optionName} (NT$ ${item.price})</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="updateCartQty(${index}, -1)" class="w-7 h-7 bg-white border border-gray-300 rounded-lg font-bold text-sm hover:bg-gray-100">-</button>
                <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
                <button onclick="updateCartQty(${index}, 1)" class="w-7 h-7 bg-white border border-gray-300 rounded-lg font-bold text-sm hover:bg-gray-100">+</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      if(navCount) navCount.innerText = totalCount;
      if(floatBadge) floatBadge.innerText = totalCount;
      if(totalEl) totalEl.innerText = `NT$ ${totalPrice}`;
    }

    // 購物車結帳 (連同備註寫入 Firebase)
    window.checkoutCart = async () => {
      const user = auth.currentUser;
      if (!user) return alert("請先完成 Google 登入才能送出購物車！");
      if (cart.length === 0) return alert("購物車是空的！");

      const orderNote = (document.getElementById('cart-order-note')?.value || "").trim();

      let currentNickname = user.displayName || "團員";
      try {
        const uSnap = await getDoc(doc(db, "users", user.uid));
        if (uSnap.exists() && uSnap.data()?.nickname) currentNickname = uSnap.data().nickname;
      } catch(e) {}

      if (confirm(`確定要送出購物車內的 ${cart.length} 項商品嗎？`)) {
        try {
          for (const item of cart) {
            await addDoc(collection(db, "orders"), {
              userId: user.uid,
              userName: currentNickname,
              userEmail: user.email,
              storeTitle: item.storeTitle,
              productName: item.productName,
              optionName: item.optionName,
              price: item.price,
              qty: item.qty,
              note: orderNote, // 儲存買家填寫的備註
              status: "已下單",
              historyLogs: [{
                action: `團員自主結帳 (購物車)${orderNote ? ' [備註: ' + orderNote + ']' : ''}`,
                operator: `${currentNickname} (${user.email})`,
                timestamp: new Date().toLocaleString()
              }],
              createdAt: serverTimestamp()
            });
          }
          cart = [];
          saveCart();
          document.getElementById('cart-order-note').value = "";
          closeCartModal();
          alert("🎉 訂單已成功送出！可在下方「我的下單紀錄」查看。");
        } catch (e) {
          alert("結帳失敗：" + e.message);
        }
      }
    };

    // 轉單發起
    window.startOrderTransfer = async (orderId, productName, optionName) => {
      const user = auth.currentUser;
      if (!user) return alert("請先登入！");
      if (!confirm(`確定要將【${productName} - ${optionName}】轉單出去嗎？`)) return;

      const code = Math.floor(100000 + Math.random() * 900000).toString();
      
      let currentNickname = user.displayName || "團員";
      try {
        const uSnap = await getDoc(doc(db, "users", user.uid));
        if (uSnap.exists() && uSnap.data()?.nickname) currentNickname = uSnap.data().nickname;
      } catch(e) {}

      try {
        await updateDoc(doc(db, "orders", orderId), {
          status: "轉單中",
          transferCode: code,
          historyLogs: arrayUnion({
            action: `團員發起轉單 (驗證碼: ${code})`,
            operator: `${currentNickname} (${user.email})`,
            timestamp: new Date().toLocaleString()
          })
        });

        alert(`🔑 轉單驗證碼已生成：【 ${code} 】\n請將驗證碼提供給接收對象。`);
      } catch (e) {
        alert("發起轉單失敗：" + e.message);
      }
    };

    // 接收轉單
    window.receiveTransferPrompt = async () => {
      const user = auth.currentUser;
      if (!user) return alert("請先登入後再接收轉單！");

      const inputCode = prompt("請輸入對方給您的 6 位數轉單驗證碼：");
      if (!inputCode || !inputCode.trim()) return;

      const code = inputCode.trim();

      try {
        const q = query(collection(db, "orders"), where("transferCode", "==", code), where("status", "==", "轉單中"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) return alert("❌ 找不到對應的轉單驗證碼，或該訂單已被接收/取消！");

        let currentNickname = user.displayName || "團員";
        try {
          const uSnap = await getDoc(doc(db, "users", user.uid));
          if (uSnap.exists() && uSnap.data()?.nickname) currentNickname = uSnap.data().nickname;
        } catch(e) {}

        const targetDoc = snapshot.docs[0];
        const oldOrder = targetDoc.data();

        await updateDoc(doc(db, "orders", targetDoc.id), {
          userId: user.uid,
          userName: currentNickname,
          userEmail: user.email,
          status: "已下單",
          transferCode: null,
          historyLogs: arrayUnion({
            action: `轉單接收成功：由 [${oldOrder.userName || '原買家'}] 轉交給 [${currentNickname}]`,
            operator: `${currentNickname} (${user.email})`,
            timestamp: new Date().toLocaleString()
          })
        });

        alert(`🎉 轉單成功！【${oldOrder.productName} - ${oldOrder.optionName}】已移交至您的帳戶！`);
      } catch (e) {
        alert("接收轉單失敗：" + e.message);
      }
    };

    document.getElementById('close-modal-btn').addEventListener('click', () => modal.classList.add('hidden'));
    window.openImageModal = (src) => {
      modalImg.src = src;
      modal.classList.remove('hidden');
    };

    // 商品列表渲染
    onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
      container.innerHTML = "";
      if (snapshot.empty) {
        container.innerHTML = "<p class='text-gray-500'>目前沒有進行中的團購商品。</p>";
        return;
      }

      const groups = {};
      snapshot.forEach((doc) => {
        const item = { id: doc.id, ...doc.data() };
        if (item.status === "archived") return;

        const title = item.storeTitle || "未分類團購";
        if (!groups[title]) groups[title] = [];
        groups[title].push(item);
      });

      if (Object.keys(groups).length === 0) {
        container.innerHTML = "<p class='text-gray-500'>目前沒有進行中的團購商品。</p>";
        return;
      }

      Object.keys(groups).forEach(storeTitle => {
        const groupSection = document.createElement('div');
        groupSection.className = "bg-white p-5 rounded-2xl border border-gray-200 shadow-sm space-y-4";

        let productsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

        groups[storeTitle].forEach(item => {
          const optionsHtml = (item.options || []).map(opt => {
            const isOptOutOfStock = opt.isOutOfStock || item.status === "out_of_stock";

            if (isOptOutOfStock) {
              return `
                <div class="flex justify-between items-center bg-gray-100 p-2.5 rounded-lg border text-sm opacity-60">
                  <span class="font-medium text-gray-500 line-through">${opt.name}</span>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-gray-400">NT$ ${opt.price}</span>
                    <button disabled class="bg-gray-400 text-white text-xs px-3 py-1.5 rounded-lg font-bold cursor-not-allowed">
                      🚫 售完
                    </button>
                  </div>
                </div>
              `;
            } else {
              return `
                <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-sm">
                  <span class="font-medium text-gray-700">${opt.name}</span>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-blue-600">NT$ ${opt.price}</span>
                    <button onclick="addToCart('${storeTitle}', '${item.productName}', '${opt.name}', ${opt.price})" 
                            class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg shadow-sm font-bold">
                      + 購物車
                    </button>
                  </div>
                </div>
              `;
            }
          }).join('');

          productsHtml += `
            <div class="border rounded-xl p-4 flex flex-col justify-between space-y-3 bg-white hover:shadow-md transition relative">
              <div>
                <div class="relative group cursor-pointer overflow-hidden rounded-lg mb-3" onclick="openImageModal('${item.imageUrl}')">
                  <img src="${item.imageUrl}" class="w-full h-44 object-cover group-hover:scale-105 transition duration-200" alt="${item.productName}">
                  <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-xs font-bold transition">
                    🔍 點擊看全圖
                  </div>
                </div>
                <h4 class="font-bold text-gray-900 text-base">${item.productName}</h4>
              </div>
              <div class="space-y-2">
                ${optionsHtml}
              </div>
            </div>
          `;
        });

        productsHtml += `</div>`;

        groupSection.innerHTML = `
          <div class="flex items-center gap-2 border-b pb-3">
            <span class="text-lg">📢</span>
            <h3 class="text-xl font-bold text-blue-900">${storeTitle}</h3>
          </div>
          ${productsHtml}
        `;

        container.appendChild(groupSection);
      });
    });

    // 個人歷史訂單列表 (顯示備註)
    onAuthStateChanged(auth, (user) => {
      renderCart();
      if (!user) {
        myOrdersContainer.innerHTML = "<p class='text-gray-400 text-sm'>請先登入以檢視您的訂單紀錄。</p>";
        return;
      }

      onSnapshot(query(collection(db, "orders"), where("userId", "==", user.uid)), (snapshot) => {
        if (snapshot.empty) {
          myOrdersContainer.innerHTML = "<p class='text-gray-500 text-sm'>您目前尚無下單紀錄。</p>";
          return;
        }

        let html = `<div class="space-y-3">`;
        snapshot.forEach(docSnap => {
          const ord = docSnap.data();
          const ordId = docSnap.id;
          const isTransferring = ord.status === "轉單中";

          html += `
            <div class="p-3.5 border rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-50 text-sm gap-2">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded">${ord.storeTitle || '團購'}</span>
                  ${isTransferring ? `<span class="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">🔑 轉單驗證碼：${ord.transferCode}</span>` : ''}
                </div>
                <div class="font-bold text-gray-800">
                  ${ord.productName} (${ord.optionName}) x${ord.qty || 1}
                </div>
                ${ord.note ? `<div class="text-xs text-amber-800 bg-amber-50 px-2 py-0.5 rounded inline-block mt-1 font-medium">📝 買家備註：${ord.note}</div>` : ''}
              </div>
              
              <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4">
                <div class="text-right">
                  <div class="font-bold text-blue-600">NT$ ${(ord.price || 0) * (ord.qty || 1)}</div>
                  <div class="text-xs text-gray-400">${ord.status || '已下單'}</div>
                </div>
                
                <button onclick="startOrderTransfer('${ordId}', '${ord.productName}', '${ord.optionName}')" 
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2.5 py-1.5 rounded-lg font-medium transition">
                  🔄 轉單
                </button>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        myOrdersContainer.innerHTML = html;
      });
    });
  </script>
</body>
</html>
