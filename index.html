<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團購賣場</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-24">

  <!-- 頁首導覽列 -->
  <nav class="bg-white border-b shadow-sm p-4 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">🛒 團購賣場</h1>
      <div id="user-info" class="flex items-center gap-3">
        <span class="text-xs text-gray-400">載入中...</span>
      </div>
    </div>
  </nav>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-8">
    <div class="flex justify-between items-center border-b pb-4">
      <h2 class="text-2xl font-bold text-gray-800">進行中的團購</h2>
      <a href="admin.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded">團主後台</a>
    </div>

    <!-- 商品依團購分類區 -->
    <div id="products-container" class="space-y-8">
      <p class="text-gray-500">商品載入中...</p>
    </div>

    <!-- 團員個人歷史訂單區 -->
    <div class="mt-12 pt-8 border-t border-gray-200">
      <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        📜 我的下單紀錄
      </h3>
      <div id="my-orders-container" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
        <p class="text-gray-400 text-sm">請先登入以檢視您的訂單紀錄。</p>
      </div>
    </div>
  </main>

  <!-- 右下角懸浮購物車按鈕 -->
  <button id="cart-floating-btn" onclick="openCartModal()" class="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3.5 rounded-full shadow-2xl flex items-center gap-3 z-40 transition transform active:scale-95">
    <span class="text-lg">🛒 購物車</span>
    <span id="cart-badge" class="bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
  </button>

  <!-- 購物車抽屜 Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h3 class="text-xl font-bold text-gray-800">🛍️ 購物車清單</h3>
          <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
        </div>

        <div id="cart-items-container" class="space-y-3">
          <p class="text-gray-400 text-sm text-center py-8">購物車目前是空的</p>
        </div>
      </div>

      <div class="border-t pt-4 space-y-3 bg-white">
        <div class="flex justify-between text-lg font-bold">
          <span>總計金額：</span>
          <span id="cart-total-price" class="text-blue-600">NT$ 0</span>
        </div>
        <button onclick="checkoutCart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition">
          一鍵送出訂單
        </button>
      </div>
    </div>
  </div>

  <!-- 圖片大圖 Modal -->
  <div id="image-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="relative max-w-4xl w-full flex justify-center items-center">
      <button id="close-modal-btn" class="absolute -top-10 right-0 text-white text-3xl font-bold hover:text-gray-300">&times;</button>
      <img id="modal-img" src="" class="max-h-[85vh] max-w-full object-contain rounded-lg shadow-2xl">
    </div>
  </div>

  <script type="module">
    import { db, auth } from "./auth.js";
    import { collection, onSnapshot, query, orderBy, where, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const container = document.getElementById('products-container');
    const myOrdersContainer = document.getElementById('my-orders-container');
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const closeModalBtn = document.getElementById('close-modal-btn');

    // 購物車本地暫存
    let cart = JSON.parse(localStorage.getItem('user_cart') || '[]');

    function saveCart() {
      localStorage.setItem('user_cart', JSON.stringify(cart));
      renderCart();
    }

    window.openCartModal = () => document.getElementById('cart-modal').classList.remove('hidden');
    window.closeCartModal = () => document.getElementById('cart-modal').classList.add('hidden');

    // 純加入購物車（不安裝直接下單）
    window.addToCart = (storeTitle, productName, optionName, price) => {
      const existingIndex = cart.findIndex(i => i.storeTitle === storeTitle && i.productName === productName && i.optionName === optionName);
      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({ storeTitle, productName, optionName, price, qty: 1 });
      }
      saveCart();
      alert(`已將【${productName} - ${optionName}】放入購物車！`);
    };

    window.updateCartQty = (index, delta) => {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveCart();
    };

    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const badge = document.getElementById('cart-badge');
      const totalEl = document.getElementById('cart-total-price');

      let totalCount = 0;
      let totalPrice = 0;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-sm text-center py-8">購物車目前是空的</p>`;
      } else {
        let html = '';
        cart.forEach((item, index) => {
          totalCount += item.qty;
          totalPrice += item.price * item.qty;
          html += `
            <div class="p-3 border rounded-lg bg-gray-50 flex justify-between items-center">
              <div>
                <div class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded inline-block mb-1">${item.storeTitle}</div>
                <div class="font-bold text-gray-800 text-sm">${item.productName}</div>
                <div class="text-xs text-gray-500">${item.optionName} - NT$ ${item.price}</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="updateCartQty(${index}, -1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 rounded font-bold text-xs">-</button>
                <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
                <button onclick="updateCartQty(${index}, 1)" class="w-6 h-6 bg-gray-200 hover:bg-gray-300 rounded font-bold text-xs">+</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      }

      badge.innerText = totalCount;
      totalEl.innerText = `NT$ ${totalPrice}`;
    }

    // 購物車統一結帳
    window.checkoutCart = async () => {
      const user = auth.currentUser;
      if (!user) {
        alert("請先完成 Google 登入才能送出購物車！");
        return;
      }
      if (cart.length === 0) {
        alert("購物車是空的！");
        return;
      }

      // 取得資料庫註冊暱稱
      let currentNickname = user.displayName || "團員";
      try {
        const uSnap = await getDoc(doc(db, "users", user.uid));
        if (uSnap.exists() && uSnap.data().nickname) {
          currentNickname = uSnap.data().nickname;
        }
      } catch(e) {}

      if (confirm(`確定要送出購物車內的 ${cart.length} 項商品嗎？`)) {
        try {
          for (const item of cart) {
            await addDoc(collection(db, "orders"), {
              userId: user.uid,
              userName: currentNickname,
              userEmail: user.email,
              storeTitle: item.storeTitle,
              productName: item.productName,
              optionName: item.optionName,
              price: item.price,
              qty: item.qty,
              status: "已下單",
              historyLogs: [{
                action: "團員自主下單 (購物車)",
                operator: `${currentNickname} (${user.email})`,
                timestamp: new Date().toLocaleString()
              }],
              createdAt: serverTimestamp()
            });
          }
          cart = [];
          saveCart();
          closeCartModal();
          alert("🎉 購物車訂單已成功送出！");
        } catch (e) {
          console.error("結帳失敗", e);
          alert("結帳失敗：" + e.message);
        }
      }
    };

    // 關閉大圖
    closeModalBtn.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.add('hidden'); });

    window.openImageModal = (src) => {
      modalImg.src = src;
      modal.classList.remove('hidden');
    };

    // 1. 讀取商品並分類
    const qProducts = query(collection(db, "products"), orderBy("createdAt", "desc"));
    onSnapshot(qProducts, (snapshot) => {
      container.innerHTML = "";
      if (snapshot.empty) {
        container.innerHTML = "<p class='text-gray-500'>目前沒有進行中的團購商品。</p>";
        return;
      }

      const groups = {};
      snapshot.forEach((doc) => {
        const item = { id: doc.id, ...doc.data() };
        const title = item.storeTitle || "未分類團購";
        if (!groups[title]) groups[title] = [];
        groups[title].push(item);
      });

      Object.keys(groups).forEach(storeTitle => {
        const groupSection = document.createElement('div');
        groupSection.className = "bg-white p-5 rounded-2xl border border-gray-200 shadow-sm space-y-4";

        let productsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;

        groups[storeTitle].forEach(item => {
          const optionsHtml = (item.options || []).map(opt => `
            <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-sm">
              <span class="font-medium text-gray-700">${opt.name}</span>
              <div class="flex items-center gap-2">
                <span class="font-bold text-blue-600">NT$ ${opt.price}</span>
                <button onclick="addToCart('${storeTitle}', '${item.productName}', '${opt.name}', ${opt.price})" 
                        class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg shadow-sm font-medium">
                  + 加入購物車
                </button>
              </div>
            </div>
          `).join('');

          productsHtml += `
            <div class="border rounded-xl p-4 flex flex-col justify-between space-y-3 bg-white hover:shadow-md transition">
              <div>
                <div class="relative group cursor-pointer overflow-hidden rounded-lg mb-3" onclick="openImageModal('${item.imageUrl}')">
                  <img src="${item.imageUrl}" class="w-full h-44 object-cover group-hover:scale-105 transition duration-200" alt="${item.productName}">
                  <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-xs font-bold transition">
                    🔍 點擊查看大圖
                  </div>
                </div>
                <h4 class="font-bold text-gray-900 text-base">${item.productName}</h4>
              </div>
              <div class="space-y-2">
                ${optionsHtml}
              </div>
            </div>
          `;
        });

        productsHtml += `</div>`;

        groupSection.innerHTML = `
          <div class="flex items-center gap-2 border-b pb-3">
            <span class="text-lg">📢</span>
            <h3 class="text-xl font-bold text-blue-900">${storeTitle}</h3>
          </div>
          ${productsHtml}
        `;

        container.appendChild(groupSection);
      });
    });

    // 團員個人訂單即時監聽
    onAuthStateChanged(auth, (user) => {
      renderCart();
      if (!user) {
        myOrdersContainer.innerHTML = "<p class='text-gray-400 text-sm'>請先登入以檢視您的訂單紀錄。</p>";
        return;
      }

      const qMyOrders = query(collection(db, "orders"), where("userId", "==", user.uid));
      onSnapshot(qMyOrders, (snapshot) => {
        if (snapshot.empty) {
          myOrdersContainer.innerHTML = "<p class='text-gray-500 text-sm'>您目前尚無下單紀錄。</p>";
          return;
        }

        let html = `<div class="space-y-3">`;
        snapshot.forEach(doc => {
          const ord = doc.data();
          html += `
            <div class="p-3 border rounded-lg flex justify-between items-center bg-gray-50 text-sm">
              <div>
                <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded mr-2">${ord.storeTitle || '團購'}</span>
                <span class="font-bold text-gray-800">${ord.productName}</span>
                <span class="text-gray-600"> (${ord.optionName}) x${ord.qty || 1}</span>
              </div>
              <div class="text-right">
                <div class="font-bold text-blue-600">NT$ ${(ord.price || 0) * (ord.qty || 1)}</div>
                <div class="text-xs text-gray-400">${ord.status || '處理中'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        myOrdersContainer.innerHTML = html;
      });
    });
  </script>
</body>
</html>
