<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 手機適配必備設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團員首頁 - 代購網站</title>
  <!-- 載入 Tailwind CSS (不用下載，自動適配電腦與手機樣式) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google 登入 SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-50 flex flex-col md:flex-row min-h-screen">

  <!-- 1. 電腦端側邊欄 (Sidebar) -->
  <aside class="hidden md:flex flex-col w-64 bg-white border-r min-h-screen p-4">
    <h1 class="text-xl font-bold mb-6 text-indigo-600">🛍️ 代購小幫手</h1>
    <nav class="flex flex-col space-y-2">
      <a href="index.html" class="p-3 rounded-lg bg-indigo-50 text-indigo-600 font-bold">🛒 商品大廳</a>
      <a href="search.html" class="p-3 rounded-lg text-gray-600 hover:bg-gray-100">🔍 搜尋商品</a>
      <a href="admin.html" class="p-3 rounded-lg text-gray-600 hover:bg-gray-100">👑 團主管理後台</a>
    </nav>
    <div class="mt-auto pt-4 border-t">
      <!-- 登入狀態區塊 -->
      <div id="user-info-desktop" class="text-sm text-gray-500 mb-2">未登入</div>
      <button id="login-btn-desktop" onclick="handleGoogleLogin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">
        Google 登入
      </button>
    </div>
  </aside>

  <!-- 2. 手機端頂部欄 -->
  <header class="md:hidden bg-white border-b p-4 flex justify-between items-center">
    <h1 class="text-lg font-bold text-indigo-600">🛍️ 代購小幫手</h1>
    <button id="login-btn-mobile" onclick="handleGoogleLogin()" class="bg-indigo-600 text-white px-3 py-1.5 text-sm rounded-lg">
      登入
    </button>
  </header>

  <!-- 3. 主要內容區域 -->
  <main class="flex-1 p-4 md:p-8 mb-16 md:mb-0">
    <h2 class="text-2xl font-bold mb-4">最新商品</h2>
    <!-- 商品展示區（範例卡片） -->
    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <p class="text-gray-400">商品載入中...</p>
    </div>
  </main>

  <!-- 4. 手機端底部捷徑欄 (Bottom Navigation) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-xs text-center">
    <a href="index.html" class="flex-1 py-1 text-indigo-600 font-bold">🛒<br>首頁</a>
    <a href="search.html" class="flex-1 py-1 text-gray-600">🔍<br>搜尋</a>
    <a href="admin.html" class="flex-1 py-1 text-gray-600">👑<br>團主</a>
  </nav>

  <!-- 5. 引入邏輯檔 -->
  <script src="products.js"></script>
</body>
</html>
