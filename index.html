<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團購賣場</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <!-- 頁首 -->
  <nav class="bg-white border-b shadow-sm p-4 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-600">🛒 團購賣場</h1>
      <div id="user-info" class="flex items-center gap-3">
        <span class="text-xs text-gray-400">載入中...</span>
      </div>
    </div>
  </nav>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">進行中的團購商品</h2>
      <a href="admin.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded">團主後台</a>
    </div>

    <!-- 商品列表區 -->
    <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <p class="text-gray-500">商品載入中...</p>
    </div>
  </main>

  <!-- Firebase 邏輯 -->
  <script type="module">
    import { db } from "./auth.js";
    import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const container = document.getElementById('products-container');

    // 即時讀取 Firestore 商品並渲染
    const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      container.innerHTML = "";
      if (snapshot.empty) {
        container.innerHTML = "<p class='text-gray-500'>目前沒有進行中的團購商品。</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const item = doc.data();
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col";
        
        const optionsHtml = (item.options || []).map(opt => `
          <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-sm">
            <span class="font-medium text-gray-700">${opt.name}</span>
            <div class="flex items-center gap-2">
              <span class="font-bold text-blue-600">NT$ ${opt.price}</span>
              <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2.5 py-1 rounded">下單</button>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <img src="${item.imageUrl}" class="w-full h-48 object-cover bg-gray-100" alt="${item.productName}">
          <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
            <div>
              <span class="text-xs font-semibold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">${item.storeTitle}</span>
              <h3 class="text-lg font-bold text-gray-900 mt-2">${item.productName}</h3>
            </div>
            <div class="space-y-2">
              ${optionsHtml}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }, (err) => {
      console.error("同步失敗：", err);
      container.innerHTML = `<p class='text-red-500'>無法載入商品 (${err.message})，請檢查權限設定。</p>`;
    });
  </script>
</body>
</html>
